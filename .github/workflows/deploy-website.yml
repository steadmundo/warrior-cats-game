# Builds the browser game and deploys the warrior-cats-game Worker.
# Needs the GitHub secret CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers).
name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "game/**"
      - "web/**"
      - "tools/cf_build.sh"
      - "tools/deploy_web.py"
      - "tools/export_game.py"
      - "tools/check_game.py"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 8d7808cecdf479b7b2a814df0af9b1b2
  GODOT_VERSION: 4.6.3-stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add a GitHub secret named CLOUDFLARE_API_TOKEN (Cloudflare template: Edit Cloudflare Workers)."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build the browser version
        run: bash tools/cf_build.sh

      - name: Deploy warrior-cats-game
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
