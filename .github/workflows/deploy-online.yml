# Deploys the warrior-cats-online room server Worker.
# Needs the GitHub secret CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers).
name: Deploy room server

on:
  push:
    branches: [master]
    paths:
      - "online/**"
      - ".github/workflows/deploy-online.yml"
  workflow_dispatch:

concurrency:
  group: deploy-online-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 8d7808cecdf479b7b2a814df0af9b1b2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add a GitHub secret named CLOUDFLARE_API_TOKEN (Cloudflare template: Edit Cloudflare Workers)."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy warrior-cats-online
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: online
          command: deploy
